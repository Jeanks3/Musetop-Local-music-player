[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musetop"
version = "0.1.0a1"
description = "Minimal offline desktop music player built with PySide6 and libmpv"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Musetop contributors" }]
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.8",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pyinstaller>=6.0",
]

[project.scripts]
musetop = "musetop.main:main"

[tool.setuptools.packages.find]
include = ["musetop*"]

[tool.setuptools.package-data]
musetop = [
    "resources/*",
    "ui/icons/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require libmpv and ffmpeg",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["musetop/app", "musetop/core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
